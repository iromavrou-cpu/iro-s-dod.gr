<body>

 <div  id="BiribaBackground">
    <a href="biriba.html" class="back-link"> ← My Biriba </a>
   
    <img src="visuals/spyrosdod.jpeg" alt="spyrosdod" class="biriba-card">
    <img src="visuals/speaker.png" alt="speaker" id="speaker2" onclick="document.getElementById('DodCall').play();">
    <audio id="DodCall" src="visuals/DODCALL.m4a"></audio>
   
    <!-- <h2 id="Press">Press and hear<br> a long distance<br>  call...</h2>  -->

    <img src="visuals/speakerRED.png" alt="speaker" id="speaker" style="cursor:pointer;">
    <audio id="homeAudio" src="visuals/tzitzikiaAudio.m4a" loop></audio>

    <script>
        const speaker = document.getElementById('speaker'); 
        const audio = document.getElementById('homeAudio');
        let isWhite = false;

        speaker.addEventListener('click', function() {
            if (isWhite) {
                this.src = 'visuals/speakerRED.png';
                audio.pause();
                audio.currentTime = 0;
            } else {
                this.src = 'visuals/speaker.png';
                audio.play();
            }
            isWhite = !isWhite;
        });
    </script>

     <h1>iro's dod.gr</h1>
     <img src="visuals/bluelogo.png" alt="AnthosLogo" id="AnthosLogo">

 </div>

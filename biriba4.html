<!DOCTYPE html>
<html>

<head>
    <title>iro's dod- biriba-4</title>

    <link rel="stylesheet" href="style(p1).css">
    <link href="https://fonts.googleapis.com/css2?family=Lacquer&display=swap" rel="stylesheet">
</head>

<body>

 <div  id="BiribaBackground">

    <a href="biriba.html" class="back-link"> ← My Biriba </a>
    <h1>iro's dod.gr</h1>
    <img src="visuals/bluelogo.png" alt="AnthosLogo" id="AnthosLogo">

    <img src="visuals/speakerRED.png" alt="speaker" id="speaker" style="cursor:pointer;">
    <audio id="homeAudio" src="visuals/tzitzikiaAudio.m4a" loop></audio>

    <script>
        const speaker = document.getElementById('speaker');
        const audio = document.getElementById('homeAudio');
        let isWhite = false;

        speaker.addEventListener('click', function() {
            if (isWhite) {
                this.src = 'visuals/speakerRED.png';
                audio.pause();
                audio.currentTime = 0;
            } else {
                this.src = 'visuals/speaker.png';
                audio.play();
            }
            isWhite = !isWhite;
        });
    </script>


    <video class="biriba-card" autoplay muted loop playsinline>
        <source src="visuals/tinos.m4a" type="video/quicktime">
    </video>

    <img src="visuals/speaker.png" alt="speaker" id="speaker2">
    <!-- <h2 id="Press">Press for a <br> Greek August<br> Drive</h2> -->

    <img src="visuals/speaker.png" alt="speaker" id="speaker2" onclick="document.getElementById('tinos').play();">
    <audio id="tinos" src="visuals/tinos.mp4"></audio>

 </div>
<footer>
    <p>Designed as a web art piece inspired by <strong>dod.gr</strong></p>
  </footer>
</body>

</html=
